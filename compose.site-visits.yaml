services:
  site-sayaci:
    build: ./site-sayaci
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    expose: ["3806"]
    networks: [proxy]
    volumes:
      - private:/var/lib/site-sayaci
      - aggregate:/var/lib/site-sayaci/out
    environment:
      SITE_ID: skywork
      SITE_ORIGIN: https://skywork.seymata.com
      SITE_VISITS_ENABLED: "${SITE_VISITS_ENABLED:-0}"
    labels:
      com.seymata.site-visits.app: skywork
      com.seymata.site-visits.host: skywork.seymata.com
      com.seymata.site-visits.schema: '1'
      traefik.enable: 'true'
      traefik.docker.network: "${SITE_VISITS_PROXY_NETWORK:?set the existing verified proxy network}"
      traefik.http.routers.site-visits-skywork.rule: "Host(`skywork.seymata.com`) && (Path(`/.well-known/site-visits/client.mjs`) || Path(`/.well-known/site-visits/page`))"
      traefik.http.routers.site-visits-skywork.entrypoints: https
      traefik.http.routers.site-visits-skywork.tls: 'true'
      traefik.http.routers.site-visits-skywork.service: site-visits-skywork
      traefik.http.routers.site-visits-skywork.middlewares: site-visits-skywork-privacy
      traefik.http.services.site-visits-skywork.loadbalancer.server.port: '3806'
      traefik.http.middlewares.site-visits-skywork-privacy.headers.customrequestheaders.Cookie: ''
      traefik.http.middlewares.site-visits-skywork-privacy.headers.customrequestheaders.Authorization: ''
      traefik.http.middlewares.site-visits-skywork-privacy.headers.customrequestheaders.Referer: ''
      traefik.http.middlewares.site-visits-skywork-privacy.headers.customrequestheaders.Forwarded: ''
      traefik.http.middlewares.site-visits-skywork-privacy.headers.customrequestheaders.X-Forwarded-For: ''
      traefik.http.middlewares.site-visits-skywork-privacy.headers.customrequestheaders.X-Real-IP: ''
networks:
  proxy:
    external: true
    name: "${SITE_VISITS_PROXY_NETWORK:?set the existing verified proxy network}"
volumes:
  private:
    name: site-visits-skywork-private
  aggregate:
    name: site-visits-skywork-out
